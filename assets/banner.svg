<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#121826"/>
      <stop offset="100%" stop-color="#1a102f"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="streamLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glowing Text & Element Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- CSS Animations -->
    <style>
      .bg-rect { fill: url(#bgGrad); }
      
      /* Animated Stream Particles & Waves */
      @keyframes floatParticle {
        0% { transform: translateX(0px) translateY(0px); opacity: 0.3; }
        50% { transform: translateX(40px) translateY(-15px); opacity: 0.9; }
        100% { transform: translateX(80px) translateY(0px); opacity: 0.3; }
      }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; filter: drop-shadow(0 0 5px #8b5cf6); }
        50% { opacity: 0.85; filter: drop-shadow(0 0 15px #ec4899); }
      }

      @keyframes dashFlow {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }

      @keyframes textShimmer {
        0% { stop-color: #6366f1; }
        50% { stop-color: #ec4899; }
        100% { stop-color: #6366f1; }
      }

      .particle-1 { animation: floatParticle 6s ease-in-out infinite alternate; }
      .particle-2 { animation: floatParticle 8s ease-in-out infinite alternate-reverse; }
      .glowing-node { animation: pulseGlow 4s ease-in-out infinite; }
      .flow-line {
        stroke-dasharray: 12, 12;
        animation: dashFlow 8s linear infinite;
      }

      /* Foreground Text Styling */
      .banner-title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }

      .banner-subtitle {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #cbd5e1;
        letter-spacing: 0.2px;
      }

      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #f8fafc;
      }
    </style>
  </defs>

  <!-- LAYER 1: Background -->
  <rect width="1200" height="320" rx="16" class="bg-rect"/>

  <!-- LAYER 2: Background Dynamic/Animated Elements (Behind Text) -->
  <g opacity="0.6">
    <!-- Grid Overlay -->
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    <path d="M150 0 V320 M300 0 V320 M450 0 V320 M600 0 V320 M750 0 V320 M900 0 V320 M1050 0 V320" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

    <!-- Animated Stream Lines -->
    <path d="M -50 250 Q 300 100 600 240 T 1250 180" fill="none" stroke="url(#streamLineGrad)" stroke-width="3" class="flow-line"/>
    <path d="M -50 280 Q 400 140 750 270 T 1250 120" fill="none" stroke="url(#streamLineGrad)" stroke-width="2" class="flow-line" style="animation-duration: 12s;"/>

    <!-- Floating Ad-Stitching Nodes -->
    <circle cx="180" cy="90" r="6" fill="#3b82f6" class="particle-1"/>
    <circle cx="950" cy="80" r="8" fill="#a855f7" class="particle-2"/>
    <circle cx="1080" cy="230" r="5" fill="#ec4899" class="particle-1"/>
    <circle cx="120" cy="240" r="7" fill="#10b981" class="particle-2"/>

    <!-- Glowing Background Pod Graphic -->
    <g class="glowing-node" transform="translate(1000, 140)">
      <rect x="-50" y="-40" width="100" height="80" rx="12" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2" opacity="0.7"/>
      <polygon points="-12,-15 -12,15 15,0" fill="#a855f7"/>
    </g>
  </g>

  <!-- LAYER 3: Decorative Pill Chips (Positioned Safely Around Content) -->
  <g transform="translate(60, 48)" filter="url(#shadow)">
    <!-- Pill 1: SSAI -->
    <rect x="0" y="0" width="85" height="28" rx="14" fill="#6366f1" opacity="0.9"/>
    <text x="42.5" y="18.5" text-anchor="middle" class="badge-text">⚡ SSAI</text>

    <!-- Pill 2: SGAI -->
    <rect x="97" y="0" width="85" height="28" rx="14" fill="#8b5cf6" opacity="0.9"/>
    <text x="139.5" y="18.5" text-anchor="middle" class="badge-text">📡 SGAI</text>

    <!-- Pill 3: DAI -->
    <rect x="194" y="0" width="80" height="28" rx="14" fill="#ec4899" opacity="0.9"/>
    <text x="234" y="18.5" text-anchor="middle" class="badge-text">🎬 DAI</text>

    <!-- Pill 4: VAST / VMAP -->
    <rect x="286" y="0" width="115" height="28" rx="14" fill="#10b981" opacity="0.9"/>
    <text x="343.5" y="18.5" text-anchor="middle" class="badge-text">🎯 VAST / VMAP</text>
  </g>

  <!-- LAYER 4: Foreground Main Title & Subtitle (FOREGROUND - UNBLOCKED) -->
  <g transform="translate(60, 145)" filter="url(#shadow)">
    <!-- Title Accent Bar -->
    <rect x="0" y="0" width="8" height="85" rx="4" fill="url(#accentGrad)"/>
    
    <!-- Title Text -->
    <text x="24" y="38" class="banner-title">Awesome Video Personalization &amp; Monetization</text>
    
    <!-- Subtitle Text -->
    <text x="24" y="74" class="banner-subtitle">Server-Side Ad Insertion (SSAI) • Dynamic Ad Decisioning • Open-Source Stitching Engines</text>
  </g>

  <!-- LAYER 5: Bottom Ecosystem Bar -->
  <g transform="translate(60, 268)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="url(#accentGrad)" stroke-width="2" opacity="0.8"/>
    <text x="0" y="24" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#94a3b8">
      🔥 CURATED SAAS PLATFORMS • OPEN-SOURCE STITCHERS • HLS &amp; MPEG-DASH MANIFEST MANIPULATION • 2026 EDITION
    </text>
  </g>
</svg>
