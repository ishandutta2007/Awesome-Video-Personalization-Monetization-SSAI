<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1035"/>
    </linearGradient>

    <!-- Accent Gradient for Text Accent & Bars -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Flow Line Gradient -->
    <linearGradient id="streamLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- LAYER 1: Background Rectangle -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" stroke="#374151" stroke-width="1"/>

  <!-- LAYER 2: Background Tech Grid & Dynamic Animated Flow Waves -->
  <g opacity="0.4">
    <!-- Grid Overlay -->
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    <path d="M150 0 V320 M300 0 V320 M450 0 V320 M600 0 V320 M750 0 V320 M900 0 V320 M1050 0 V320" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

    <!-- Dynamic Wave Lines with SMIL / CSS stroke-dashoffset animation -->
    <path d="M -50 240 Q 300 110 600 230 T 1250 170" fill="none" stroke="url(#streamLineGrad)" stroke-width="3" stroke-dasharray="10 10">
      <animate attributeName="stroke-dashoffset" from="200" to="0" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M -50 270 Q 400 150 750 260 T 1250 130" fill="none" stroke="url(#streamLineGrad)" stroke-width="2" stroke-dasharray="8 8">
      <animate attributeName="stroke-dashoffset" from="0" to="200" dur="12s" repeatCount="indefinite"/>
    </path>

    <!-- Dynamic Animated Ad-Stitching Pulse Nodes -->
    <circle cx="180" cy="85" r="6" fill="#3b82f6">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="75" r="8" fill="#a855f7">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1070" cy="220" r="5" fill="#ec4899">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="235" r="7" fill="#10b981">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="4.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Animated Play Node Icon (Background Right Side) -->
    <g transform="translate(1020, 140)">
      <rect x="-45" y="-35" width="90" height="70" rx="14" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
      </rect>
      <polygon points="-10,-12 -10,12 14,0" fill="#ec4899">
        <animate attributeName="fill" values="#ec4899;#8b5cf6;#ec4899" dur="6s" repeatCount="indefinite"/>
      </polygon>
    </g>
  </g>

  <!-- LAYER 3: Decorative Pill Badges (Positioned cleanly at top-left) -->
  <g transform="translate(60, 42)">
    <!-- Pill 1: SSAI -->
    <rect x="0" y="0" width="85" height="26" rx="13" fill="#4f46e5"/>
    <text x="42.5" y="17" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#ffffff">⚡ SSAI</text>

    <!-- Pill 2: SGAI -->
    <rect x="95" y="0" width="85" height="26" rx="13" fill="#7c3aed"/>
    <text x="137.5" y="17" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#ffffff">📡 SGAI</text>

    <!-- Pill 3: DAI -->
    <rect x="190" y="0" width="80" height="26" rx="13" fill="#db2777"/>
    <text x="230" y="17" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#ffffff">🎬 DAI</text>

    <!-- Pill 4: VAST / VMAP -->
    <rect x="280" y="0" width="115" height="26" rx="13" fill="#059669"/>
    <text x="337.5" y="17" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#ffffff">🎯 VAST / VMAP</text>
  </g>

  <!-- LAYER 4: Foreground Main Title & Subtitle (FOREGROUND - Crisp, High Contrast) -->
  <g transform="translate(60, 140)">
    <!-- Vertical Title Accent Bar -->
    <rect x="0" y="0" width="8" height="85" rx="4" fill="url(#accentGrad)"/>
    
    <!-- Title Text -->
    <text x="24" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="40" fill="#ffffff" letter-spacing="-0.5">Awesome Video Personalization &amp; Monetization</text>
    
    <!-- Subtitle Text -->
    <text x="24" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="19" fill="#e2e8f0" letter-spacing="0.2">Server-Side Ad Insertion (SSAI) • Dynamic Ad Decisioning • Open-Source Stitching Engines</text>
  </g>

  <!-- LAYER 5: Bottom Ecosystem Bar -->
  <g transform="translate(60, 265)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="url(#accentGrad)" stroke-width="2" opacity="0.8"/>
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8">
      🔥 CURATED SAAS PLATFORMS • OPEN-SOURCE STITCHERS • HLS &amp; MPEG-DASH MANIFEST MANIPULATION • 2026 EDITION
    </text>
  </g>
</svg>
